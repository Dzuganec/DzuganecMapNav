<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Dzuganec 3D Nav</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--glass:rgba(16,22,40,.82);--line:rgba(255,255,255,.13);--tx:#eef2ff;--mut:#8b97b8;--ok:#39ff9c;--hot:#ff3d81;--blue:#3d8bff;--sp:cubic-bezier(.34,1.45,.64,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx)}
#map{position:absolute;inset:0}
.g{background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.top{position:absolute;z-index:10;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;max-width:520px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.search{display:flex;align-items:center;border-radius:18px;padding:2px 6px 2px 14px}
.search input{flex:1;min-width:0;height:44px;background:none;border:0;outline:0;color:var(--tx);font-size:15px;font-weight:600}
.search input::placeholder{color:var(--mut);font-weight:500}
.ib{background:none;border:0;color:var(--mut);font-size:17px;width:38px;height:38px;cursor:pointer}
.dd{list-style:none;border-radius:16px;max-height:260px;overflow:auto;display:none}
.dd li{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.dd li:last-child{border:0}.dd li:active{background:rgba(61,139,255,.25)}
.dd b{display:block;font-size:14px}.dd small{color:var(--mut);font-size:12px;line-height:1.3}
.row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.row::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:20px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--tx);cursor:pointer;transition:transform .2s var(--sp)}
.chip:active{transform:scale(.92)}
.pill{flex:none;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}.off .dot{background:var(--hot);box-shadow:0 0 8px var(--hot)}
.hud{display:none;border-radius:20px;padding:12px 14px;border-color:rgba(57,255,156,.4);flex-direction:column;gap:9px}
.hud.on{display:flex;animation:pop .45s var(--sp)}
@keyframes pop{from{transform:translateY(-16px) scale(.96);opacity:0}}
.hm{display:flex;align-items:center;gap:12px}
.turn{width:54px;height:54px;border-radius:16px;background:var(--ok);color:#04150c;font-size:30px;font-weight:800;display:grid;place-items:center;flex:none;box-shadow:0 0 22px rgba(57,255,156,.55)}
.hd{font-size:24px;font-weight:800;color:var(--ok);line-height:1}
.ht{font-size:13px;font-weight:700;margin-top:3px;line-height:1.25}
.hs{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);border-top:1px solid var(--line);padding-top:8px}.hs b{color:var(--tx)}
.btn{border:0;border-radius:13px;padding:11px 13px;font-size:13px;font-weight:800;color:var(--tx);background:rgba(255,255,255,.1);cursor:pointer;flex:1;transition:transform .2s var(--sp)}
.btn:active{transform:scale(.94)}.btn.p{background:var(--ok);color:#04150c}.btn.r{background:var(--hot)}.btn.s{flex:none;padding:9px 11px}
.side{position:absolute;z-index:9;right:10px;top:calc(176px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:9px}
.cb{width:48px;height:48px;border-radius:50%;font-size:20px;color:var(--tx);cursor:pointer;transition:transform .2s var(--sp),background .2s}
.cb:active{transform:scale(.88)}.cb.on{background:var(--blue)}
.dock{position:absolute;z-index:12;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:440px;margin:auto;height:66px;border-radius:28px;display:flex}
.di{flex:1;background:none;border:0;color:var(--mut);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:color .2s}
.di i{font-style:normal;font-size:20px;transition:transform .3s var(--sp)}.di.on{color:var(--tx)}.di.on i{transform:translateY(-3px) scale(1.15)}
.sheet{position:absolute;z-index:11;left:10px;right:10px;bottom:calc(90px + env(safe-area-inset-bottom));max-width:480px;margin:auto;border-radius:24px;padding:16px;max-height:58vh;overflow:auto;display:flex;flex-direction:column;gap:12px;transform:translateY(140%);opacity:0;pointer-events:none;transition:transform .5s var(--sp),opacity .25s}
.sheet.open{transform:none;opacity:1;pointer-events:auto}
.sh{display:flex;justify-content:space-between;gap:10px}.st{font-size:17px;font-weight:800}.ss{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.4}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;font-weight:700;padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.09)}
.br{display:flex;gap:7px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border-radius:14px;padding:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:800;font-size:14px;text-align:left;color:var(--tx);cursor:pointer}
.card small{display:block;color:var(--mut);font-weight:500;font-size:11px;margin-top:3px}.card.on{border-color:var(--ok);background:rgba(57,255,156,.13)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);margin-bottom:6px;font-size:13px;cursor:pointer}
.ach{opacity:.4}.ach.ok{opacity:1;border-color:var(--ok)}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--ok));transition:width .6s}
.toast{position:absolute;z-index:20;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-30px);opacity:0;padding:10px 16px;border-radius:16px;font-size:13px;font-weight:700;transition:.4s var(--sp);pointer-events:none;max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.me{width:22px;height:22px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 18px var(--blue)}
.pin{padding:5px 10px;border-radius:13px;font-size:12px;font-weight:800;color:#fff;border:2px solid #fff;white-space:nowrap;box-shadow:0 5px 14px rgba(0,0,0,.5)}
.maplibregl-ctrl-bottom-right{bottom:84px!important;opacity:.6}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="search g">
    <input id="q" placeholder="Улица, дом, кафе, аптека…" autocomplete="off" enterkeyhint="search">
    <button class="ib" id="qx" hidden aria-label="Очистить">✕</button>
  </div>
  <ul class="dd g" id="dd"></ul>
  <div class="row" id="cats"></div>
  <div class="row">
    <div class="pill g" id="pSteps">👟 <span id="tSteps">0</span></div>
    <div class="pill g">🚀 <span id="tSpeed">--</span></div>
    <div class="pill g">🔋 <span id="tBat">--</span></div>
    <div class="pill g" id="pNet"><span class="dot"></span><span id="tNet">онлайн</span></div>
  </div>
  <div class="hud g" id="hud">
    <div class="hm">
      <div class="turn" id="hIcon">⬆</div>
      <div style="flex:1;min-width:0"><div class="hd" id="hDist">0 м</div><div class="ht" id="hText">—</div></div>
      <button class="btn s" id="bVoice" aria-label="Голос">🔊</button>
      <button class="btn s r" id="bStop">Стоп</button>
    </div>
    <div class="hs"><span>Осталось <b id="hRem">—</b></span><span>Время <b id="hTime">—</b></span><span id="hOff"></span></div>
  </div>
</div>

<div class="side">
  <button class="cb g" id="bLoc" aria-label="Моя позиция">📍</button>
  <button class="cb g on" id="bTilt" aria-label="3D / 2D">📐</button>
  <button class="cb g" id="bDl" aria-label="Скачать район">📥</button>
</div>

<div class="toast g" id="toast"></div>

<!-- Карточка объекта -->
<div class="sheet g" id="s-card">
  <div class="sh"><div><div class="st" id="cT">Точка</div><div class="ss" id="cA"></div></div><button class="ib" data-x>✕</button></div>
  <div class="tags" id="cTags"></div>
  <div class="br"><button class="btn" id="cFrom">🚩 Отсюда</button><button class="btn" id="cFav">⭐ В избранное</button><button class="btn p" id="cGo">Сюда →</button></div>
</div>

<!-- Стиль -->
<div class="sheet g" id="s-style">
  <div class="sh"><div><div class="st">Стиль карты</div><div class="ss">Маршрут и 3D работают во всех режимах</div></div><button class="ib" data-x>✕</button></div>
  <div class="grid">
    <button class="card on" data-th="night">⚡ Неон ночь<small>Тёмная, дома по высоте</small></button>
    <button class="card" data-th="day">🏙️ Город день<small>Светлая 3D</small></button>
    <button class="card" data-th="dgis">🏢 Тёплая 2ГИС<small>Контраст по этажности</small></button>
    <button class="card" data-th="sat">🛰️ Спутник<small>Esri + подписи + 3D</small></button>
  </div>
</div>

<!-- Места -->
<div class="sheet g" id="s-places">
  <div class="sh"><div><div class="st">Места и офлайн-база</div><div class="ss" id="dbInfo"></div></div><button class="ib" data-x>✕</button></div>
  <button class="btn p" id="pDl">📥 Скачать район для офлайн-поиска</button>
  <div id="favs"></div>
</div>

<!-- Мой мир -->
<div class="sheet g" id="s-world">
  <div class="sh"><div><div class="st">🌍 Мой мир</div><div class="ss">Исследованные клетки ≈150×220 м</div></div><button class="ib" data-x>✕</button></div>
  <div class="bar"><i id="wBar"></i></div>
  <div class="grid">
    <div class="card"><span id="wSteps">0</span><small>шагов</small></div>
    <div class="card"><span id="wKm">0</span><small>км пройдено</small></div>
    <div class="card"><span id="wCells">0</span><small id="wPct">клеток открыто</small></div>
    <div class="card"><span id="wRoutes">0</span><small>маршрутов</small></div>
  </div>
  <div id="ach"></div>
  <button class="btn" id="wReset">🗑️ Сбросить статистику</button>
</div>

<nav class="dock g">
  <button class="di on" data-tab="map"><i>📍</i>карта</button>
  <button class="di" data-tab="places"><i>⭐</i>места</button>
  <button class="di" data-tab="world"><i>🌍</i>мой мир</button>
  <button class="di" data-tab="style"><i>🎨</i>стиль</button>
</nav>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е');
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const fmt=m=>m>=1000?(m/1000).toFixed(1)+' км':Math.round(m)+' м';
const hav=(a,b)=>{const r=Math.PI/180,dl=(b[1]-a[1])*r,dn=(b[0]-a[0])*r,x=Math.sin(dl/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dn/2)**2;return 12742000*Math.asin(Math.sqrt(x))};
let tt;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2800)}

/* ---------- IndexedDB ---------- */
const dbp=new Promise((ok,no)=>{const r=indexedDB.open('dz',1);r.onupgradeneeded=()=>{r.result.createObjectStore('p',{keyPath:'id'});r.result.createObjectStore('r',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(s,m,f)=>{const d=await dbp;return new Promise((ok,no)=>{const t=d.transaction(s,m);const q=f(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})};
const putMany=(s,a)=>tx(s,'readwrite',st=>{a.forEach(x=>st.put(x))});
let pcache=null;const allP=async()=>pcache||(pcache=await tx('p','readonly',st=>st.getAll()).catch(()=>[]));

/* ---------- Состояние ---------- */
const S={user:null,start:null,sel:null,theme:'night',tilt:true,voice:true,follow:false,nav:null,watch:null,last:null,
  steps:ls('dz_steps',0),m:ls('dz_m',0),cells:new Set(ls('dz_cells',[])),favs:ls('dz_favs',[]),routes:ls('dz_routes',0),area:ls('dz_area',null)};
const markers={};
const setMarker=(k,ll,html,cls)=>{markers[k]?.remove();markers[k]=null;if(!ll)return;const e=document.createElement('div');e.className='pin';e.style.background=cls;e.textContent=html;markers[k]=new maplibregl.Marker({element:e,anchor:'bottom'}).setLngLat(ll).addTo(map)};

const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[44.7797,48.7858],zoom:15.2,pitch:55,bearing:-15,maxPitch:75,attributionControl:false});
map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-right');

/* ---------- Слои, темы ---------- */
const ORIG={};
const pt=(l,p,v)=>{try{const k=l.id+p;if(!(k in ORIG))ORIG[k]=map.getPaintProperty(l.id,p);map.setPaintProperty(l.id,p,v===null?ORIG[k]:v)}catch{}};
const H=['coalesce',['get','render_height'],['get','height'],10];
const RAMP={night:['interpolate',['linear'],H,0,'#1b2a52',20,'#2a3f86',45,'#6a3fd0',90,'#ff3d81'],
  day:['interpolate',['linear'],H,0,'#d9dde6',20,'#b9c3d6',45,'#e4b07a',90,'#d9694a'],
  dgis:['interpolate',['linear'],H,0,'#efe6d6',15,'#e9c9a0',35,'#e08f5a',80,'#b8473a']};
const ROUTE={night:'#39ff9c',day:'#0a6cff',dgis:'#0a6cff',sat:'#ffe14d'};
map.on('load',()=>{
  const st=map.getStyle(),vs=Object.keys(st.sources).find(k=>st.sources[k].type==='vector');
  const lab=st.layers.find(l=>l.type==='symbol'&&l.layout&&l.layout['text-field'])?.id;
  if(map.getLayer('building-3d'))map.setLayoutProperty('building-3d','visibility','none');
  map.addSource('sat',{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19,attribution:'Esri'});
  map.addLayer({id:'sat',type:'raster',source:'sat',layout:{visibility:'none'}},lab);
  map.addLayer({id:'b3d',type:'fill-extrusion',source:vs,'source-layer':'building',minzoom:13,paint:{'fill-extrusion-color':RAMP.night,'fill-extrusion-height':H,'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.9}},lab);
  map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  const L={'line-join':'round','line-cap':'round'};
  map.addLayer({id:'r-glow',type:'line',source:'route',layout:L,paint:{'line-color':ROUTE.night,'line-width':20,'line-blur':12,'line-opacity':.6}},lab);
  map.addLayer({id:'r-out',type:'line',source:'route',layout:L,paint:{'line-color':'#04101f','line-width':11}},lab);
  map.addLayer({id:'r-core',type:'line',source:'route',layout:L,paint:{'line-color':ROUTE.night,'line-width':6}},lab);
  theme('night');renderFavPins();
});
function theme(m){
  S.theme=m;const n=m==='night',sat=m==='sat';
  map.setLayoutProperty('sat','visibility',sat?'visible':'none');
  map.setPaintProperty('b3d','fill-extrusion-color',RAMP[sat?'day':m]);
  map.setPaintProperty('b3d','fill-extrusion-opacity',sat?.7:.9);
  for(const l of map.getStyle().layers){
    if(l.id==='sat'||l.id==='b3d'||l.id.startsWith('r-'))continue;
    const id=l.id;
    if(l.type==='background')pt(l,'background-color',n?'#0b1020':null);
    else if(l.type==='fill'&&/water/.test(id))pt(l,'fill-color',n?'#0a3a55':null);
    else if(l.type==='fill'&&/park|wood|grass|green/.test(id))pt(l,'fill-color',n?'#0d3a2b':null);
    else if(l.type==='line'&&/road|street|highway|bridge|tunnel|motorway/.test(id)&&!/casing/.test(id))pt(l,'line-color',n?'#3b4c8a':null);
    else if(l.type==='symbol'&&l.layout?.['text-field']){pt(l,'text-color',n||sat?'#eef2ff':null);pt(l,'text-halo-color',n||sat?'#0b1020':null)}
  }
  const c=ROUTE[m];['r-glow','r-core'].forEach(i=>map.setPaintProperty(i,'line-color',c));
  map.setPaintProperty('r-out','line-color',m==='day'||m==='dgis'?'#ffffff':'#04101f');
  document.querySelector('meta[name=theme-color]').content=n?'#0b1020':'#f3f1ea';
}

/* ---------- Шторки: одна открытая за раз ---------- */
let openId=null;
function sheet(id){
  openId=id;document.querySelectorAll('.sheet').forEach(s=>s.classList.toggle('open',s.id==='s-'+id));
  const tab={places:'places',world:'world',style:'style'}[id]||'map';
  document.querySelectorAll('.di').forEach(d=>d.classList.toggle('on',d.dataset.tab===tab));
  if(id==='places')renderFavs();if(id==='world')renderWorld();
}
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>sheet(null));
document.querySelectorAll('.di').forEach(d=>d.onclick=()=>{const t=d.dataset.tab;sheet(t==='map'?null:(openId===t?null:t))});
document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-th]').forEach(x=>x.classList.toggle('on',x===b));theme(b.dataset.th);sheet(null)});
$('pSteps').onclick=()=>sheet('world');
$('bTilt').onclick=e=>{S.tilt=!S.tilt;e.currentTarget.classList.toggle('on',S.tilt);map.easeTo({pitch:S.tilt?58:0,bearing:S.tilt?map.getBearing():0,duration:700})};

/* ---------- Статус: сеть, батарея ---------- */
function net(){const on=navigator.onLine;$('pNet').classList.toggle('off',!on);$('tNet').textContent=on?'онлайн':'офлайн'}
addEventListener('online',net);addEventListener('offline',net);net();
navigator.getBattery?.().then(b=>{const r=()=>$('tBat').textContent=Math.round(b.level*100)+'%'+(b.charging?'⚡':'');r();b.onlevelchange=b.onchargingchange=r}).catch(()=>{});

/* ---------- GPS: один watcher, шаги, курс, клетки ---------- */
const cellKey=c=>Math.floor(c[0]*500)+'_'+Math.floor(c[1]*500);
let saveT;const saveStats=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{save('dz_steps',S.steps);save('dz_m',S.m);save('dz_cells',[...S.cells])},1500)};
function stats(){$('tSteps').textContent=S.steps}stats();
function track(){
  if(S.watch!==null||!navigator.geolocation)return;
  S.watch=navigator.geolocation.watchPosition(p=>{
    const c=[p.coords.longitude,p.coords.latitude],acc=p.coords.accuracy||99;S.user=c;
    $('tSpeed').textContent=p.coords.speed==null?'--':Math.round(p.coords.speed*3.6)+' км/ч';
    if(acc<25){
      if(S.last){const d=hav(S.last,c);if(d>Math.max(3,acc/2)&&d<80){S.m+=d;S.steps+=Math.round(d/.75);S.last=c;stats()}}else S.last=c;
      const k=cellKey(c);if(!S.cells.has(k)){S.cells.add(k);toast('🌍 Новая клетка открыта')}
      saveStats();
    }
    if(!markers.me){const e=document.createElement('div');e.className='me';markers.me=new maplibregl.Marker({element:e}).setLngLat(c).addTo(map);map.flyTo({center:c,zoom:16,pitch:55});$('bLoc').classList.add('on');S.follow=true}
    else markers.me.setLngLat(c);
    if(S.follow&&!S.nav)map.easeTo({center:c,duration:600});
    if(S.nav)navTick(c,p.coords.heading,p.coords.speed);
  },e=>{$('bLoc').classList.remove('on');toast(e.code===1?'Нет доступа к геопозиции. Разрешите её в настройках браузера':'Не удалось определить позицию')},{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
}
$('bLoc').onclick=()=>{if(S.user){S.follow=true;$('bLoc').classList.add('on');map.flyTo({center:S.user,zoom:16.5,pitch:S.tilt?58:0})}else track()};
map.on('dragstart',()=>{S.follow=false;$('bLoc').classList.remove('on')});

/* ---------- Поиск: локально + онлайн, fuzzy ---------- */
const CATS=[['☕ Кафе','cafe','кафе'],['🛒 Магазины','shop','магазин'],['⛽ АЗС','fuel','азс'],['💊 Аптеки','pharmacy','аптека'],['🌳 Парки','park','парк']];
$('cats').innerHTML=CATS.map(c=>`<button class="chip g" data-k="${c[1]}" data-q="${c[2]}">${c[0]}</button>`).join('');
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function score(r,toks){let sc=0;const w=r.s.split(/[\s,]+/);for(const t of toks){if(r.s.includes(t)){sc+=10+(w.some(x=>x.startsWith(t))?3:0);continue}
  let best=9;if(t.length>3)for(const x of w)if(Math.abs(x.length-t.length)<=2)best=Math.min(best,lev(t,x));
  if(best<=Math.floor(t.length/3))sc+=5-best;else return 0}return sc}
const favRecs=()=>S.favs.map((f,i)=>({id:'f'+i,t:f.title,a:'Избранное',c:f.coords,k:'fav',s:norm(f.title)}));
async function localSearch(q,kind){
  const base=[...favRecs(),...await allP()],ctr=map.getCenter(),cc=[ctr.lng,ctr.lat];
  if(kind)return base.filter(r=>r.k===kind).sort((a,b)=>hav(cc,a.c)-hav(cc,b.c)).slice(0,25);
  const toks=norm(q).split(/\s+/).filter(Boolean);
  return base.map(r=>[score(r,toks),r]).filter(x=>x[0]).sort((a,b)=>b[0]-a[0]).slice(0,12).map(x=>x[1]);
}
async function onlineSearch(q,bounded){
  if(!navigator.onLine)return[];
  try{const b=map.getBounds(),vb=[b.getWest(),b.getNorth(),b.getEast(),b.getSouth()].join(',');
    const ctl=new AbortController();setTimeout(()=>ctl.abort(),7000);
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&accept-language=ru&limit=8&q=${encodeURIComponent(q)}${bounded?`&viewbox=${vb}&bounded=1`:''}`,{signal:ctl.signal});
    const rows=(await r.json()).map(x=>({id:'n'+x.place_id,t:(x.name||x.display_name.split(',')[0]),a:x.display_name,c:[+x.lon,+x.lat],k:'poi',s:norm(x.display_name)}));
    if(rows.length){putMany('p',rows).then(()=>pcache=null)}return rows}catch{return[]}
}
let sq=0;
async function doSearch(q,kind,oq){
  const my=++sq;const loc=await localSearch(q,kind);if(my!==sq)return;render(loc);
  if(navigator.onLine){const on=await onlineSearch(oq||q,!!kind);if(my!==sq)return;
    const seen=new Set(loc.map(r=>r.id));render([...loc,...on.filter(r=>!seen.has(r.id))])}
  else if(!loc.length)render([],'Офлайн: в локальной базе ничего нет. Скачайте район (📥), пока есть сеть')
}
function render(rows,empty){
  const dd=$('dd');dd.innerHTML='';
  if(!rows.length){dd.innerHTML=empty?`<li><small>${esc(empty)}</small></li>`:'';dd.style.display=empty?'block':'none';return}
  rows.slice(0,20).forEach(r=>{const li=document.createElement('li');li.innerHTML=`<b>${esc(r.t)}</b><small>${esc(r.a)}</small>`;li.onclick=()=>{dd.style.display='none';$('q').value=r.t;pick(r)};dd.appendChild(li)});
  dd.style.display='block';
}
let st;$('q').oninput=e=>{const v=e.target.value.trim();$('qx').hidden=!v;clearTimeout(st);if(v.length<2){$('dd').style.display='none';return}st=setTimeout(()=>doSearch(v),navigator.onLine?700:150)};
$('qx').onclick=()=>{$('q').value='';$('qx').hidden=true;$('dd').style.display='none'};
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>doSearch('',c.dataset.k,c.dataset.q));
function pick(r){map.flyTo({center:r.c,zoom:17,pitch:58,duration:1600});showCard(r.c,r.t,r.a,[r.k&&r.k!=='poi'?CATS.find(c=>c[1]===r.k)?.[0]||(r.k==='street'?'🛣️ Улица':'⭐ Место'):'📌 Место'])}

/* ---------- Карточка объекта ---------- */
function showCard(c,title,addr,tags=[]){
  S.sel={c,title};
  const d=S.user?[hav(S.user,c)]:[];
  $('cT').textContent=title;$('cA').textContent=addr||`${c[1].toFixed(5)}, ${c[0].toFixed(5)}`;
  $('cTags').innerHTML=[...tags,...(d.length?['📏 '+fmt(d[0])]:[]),`📍 ${c[1].toFixed(4)}, ${c[0].toFixed(4)}`].map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  setMarker('t',c,'🏁 '+title.slice(0,24),'#ff3d81');sheet('card');
}
map.on('click',async e=>{
  $('dd').style.display='none';
  const c=[e.lngLat.lng,e.lngLat.lat],f=map.getLayer('b3d')?map.queryRenderedFeatures(e.point,{layers:['b3d']})[0]:null;
  const tags=[];if(f){const h=f.properties.render_height||f.properties.height;if(h){tags.push('🏢 '+Math.max(1,Math.round(h/3))+' эт.','↕ '+Math.round(h)+' м')}else tags.push('🏢 Здание')}
  showCard(c,f?'Здание':'Точка на карте','',tags);
  if(!navigator.onLine)return;
  try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&accept-language=ru&lat=${c[1]}&lon=${c[0]}`);const j=await r.json();
    if(j.display_name&&S.sel?.c===c){S.sel.title=j.name||(j.address?.road?[j.address.road,j.address.house_number].filter(Boolean).join(', '):j.display_name.split(',')[0]);$('cT').textContent=S.sel.title;$('cA').textContent=j.display_name}}catch{}
});
$('cFrom').onclick=()=>{if(!S.sel)return;S.start=S.sel.c;setMarker('a',S.start,'🚩 Старт','#00b36b');toast('Старт задан. Выберите точку назначения');sheet(null)};
$('cGo').onclick=()=>{if(!S.sel)return;sheet(null);route(S.sel.c)};
$('cFav').onclick=()=>{if(!S.sel)return;const n=prompt('Название места:',S.sel.title);if(!n)return;S.favs.push({title:n.slice(0,60),coords:S.sel.c});save('dz_favs',S.favs);renderFavPins();toast('⭐ Сохранено');sheet(null)};
function renderFavPins(){Object.keys(markers).filter(k=>k[0]==='f').forEach(k=>{markers[k].remove();delete markers[k]});S.favs.forEach((f,i)=>setMarker('f'+i,f.coords,'⭐ '+f.title.slice(0,18),'#ff9500'))}
async function renderFavs(){
  const n=(await allP()).length;$('dbInfo').textContent=n?`В базе: ${n} объектов`+(S.area?' · район скачан':''):'Офлайн-база пуста';
  const b=$('favs');b.innerHTML=S.favs.length?'':'<div class="li">Нет сохранённых мест. Нажмите на карту и выберите «В избранное».</div>';
  S.favs.forEach((f,i)=>{const r=document.createElement('div');r.className='li';r.innerHTML=`<span>⭐ <b>${esc(f.title)}</b></span><span class="br"><button class="btn s" data-g>🚀</button><button class="btn s r" data-d>✕</button></span>`;
    r.querySelector('[data-g]').onclick=e=>{e.stopPropagation();sheet(null);route(f.coords)};
    r.querySelector('[data-d]').onclick=e=>{e.stopPropagation();S.favs.splice(i,1);save('dz_favs',S.favs);renderFavPins();renderFavs()};
    r.onclick=()=>{sheet(null);map.flyTo({center:f.coords,zoom:16.5})};b.appendChild(r)});
}

/* ---------- Скачивание района (Overpass) ---------- */
const catOf=t=>/^(cafe|restaurant|fast_food|bar)$/.test(t.amenity)?'cafe':t.shop?'shop':t.amenity==='fuel'?'fuel':t.amenity==='pharmacy'?'pharmacy':/^(park|garden)$/.test(t.leisure)?'park':t.highway?'street':'poi';
function toRec(e){const t=e.tags||{},c=e.center?[e.center.lon,e.center.lat]:[e.lon,e.lat];if(!c[0]||!c[1])return null;
  const a=[t['addr:street'],t['addr:housenumber']].filter(Boolean).join(', '),name=t.name||a;if(!name)return null;
  return{id:'o'+e.type[0]+e.id,t:name,a:a||t['addr:city']||'',c,k:catOf(t),s:norm(`${name} ${a} ${t.highway?'улица':''}`)}}
let dl=false;
async function download(){
  if(dl)return;if(!navigator.onLine)return toast('Нужен интернет, чтобы скачать район');
  if(map.getZoom()<14)return toast('Приблизьте карту (zoom 14+), чтобы выбрать район');
  dl=true;sheet(null);toast('📥 Скачиваю район…');
  const b=map.getBounds(),bb=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].map(v=>v.toFixed(5)).join(',');
  try{
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(`[out:json][timeout:40];(nw["name"](${bb});nw["addr:housenumber"](${bb}););out center tags 5000;`)});
    if(!r.ok)throw 0;const rows=(await r.json()).elements.map(toRec).filter(Boolean);
    await putMany('p',rows);pcache=null;S.area=[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()];save('dz_area',S.area);
    toast(`✅ Сохранено объектов: ${rows.length}`);
  }catch{toast('Overpass недоступен или район слишком большой. Попробуйте позже')}
  dl=false;
}
$('bDl').onclick=download;$('pDl').onclick=download;

/* ---------- Маршрут: OSRM, кэш, офлайн-фолбэк ---------- */
const rkey=(o,d)=>[o,d].map(p=>p.map(v=>v.toFixed(4)).join(',')).join('>');
async function cachedRoute(o,d){const all=await tx('r','readonly',st=>st.getAll()).catch(()=>[]);return all.find(r=>hav(r.o,o)<150&&hav(r.d,d)<100)?.route}
async function route(dest){
  const o=S.start||S.user||(()=>{const c=map.getCenter();return[c.lng,c.lat]})();
  if(!S.start&&!S.user)setMarker('a',o,'🚩 Старт','#00b36b');
  let rt=null,off='';
  if(navigator.onLine){
    try{const ctl=new AbortController();setTimeout(()=>ctl.abort(),8000);
      const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${o[0]},${o[1]};${dest[0]},${dest[1]}?overview=full&geometries=geojson&steps=true`,{signal:ctl.signal});
      const j=await r.json();rt=j.routes?.[0]||null;
      if(rt)tx('r','readwrite',st=>st.put({id:rkey(o,dest),o,d:dest,route:rt}));
    }catch{}
  }
  if(!rt){rt=await cachedRoute(o,dest);if(rt)off='из кэша'}
  if(!rt){const d=hav(o,dest);rt={distance:d,duration:d/11,geometry:{type:'LineString',coordinates:[o,dest]},legs:[{steps:[{maneuver:{type:'depart',location:o},name:'',distance:d},{maneuver:{type:'arrive',location:dest},name:'',distance:0}]}]};off='по прямой';toast('Офлайн: дорог нет в кэше, ведём по прямой')}
  map.getSource('route').setData({type:'Feature',geometry:rt.geometry});
  const cs=rt.geometry.coordinates,bd=cs.reduce((b,c)=>b.extend(c),new maplibregl.LngLatBounds(cs[0],cs[0]));
  map.fitBounds(bd,{padding:{top:200,bottom:130,left:50,right:70},pitch:55,duration:1200,maxZoom:17});
  const steps=rt.legs[0].steps;
  S.nav={steps,i:steps.length>1?1:0,total:rt.distance,dur:rt.duration,said:-1};S.routes++;save('dz_routes',S.routes);
  setMarker('t',dest,'🏁 Финиш','#ff3d81');$('hOff').textContent=off;$('hud').classList.add('on');
  navTick(S.user||o,null,null);if(S.user)S.follow=false;
}
function maneuver(s){
  const t=s.maneuver?.type,m=s.maneuver?.modifier||'',n=s.name?` на ${s.name}`:'';
  if(t==='arrive')return['🏁','Вы прибыли'];if(t==='depart')return['⬆','Начните движение'+n];
  if(t==='roundabout'||t==='rotary')return['⟳','Круговое движение'+n];
  if(/uturn/.test(m))return['↩','Развернитесь'+n];
  if(/sharp right/.test(m))return['↘','Резко направо'+n];if(/slight right/.test(m))return['↗','Плавно направо'+n];if(/right/.test(m))return['➡','Поверните направо'+n];
  if(/sharp left/.test(m))return['↙','Резко налево'+n];if(/slight left/.test(m))return['↖','Плавно налево'+n];if(/left/.test(m))return['⬅','Поверните налево'+n];
  return['⬆','Прямо'+n];
}
function say(t){if(!S.voice||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';speechSynthesis.speak(u)}
function navTick(c,heading,speed){
  const n=S.nav;if(!n)return;const s=n.steps[n.i];if(!s)return;
  const d=hav(c,s.maneuver.location),[ic,tx_]=maneuver(s);
  if(d<25){if(n.i<n.steps.length-1){n.i++;n.said=-1;return navTick(c,heading,speed)}say('Вы прибыли');toast('🏁 Вы прибыли');return stopNav()}
  let rest=d;for(let i=n.i;i<n.steps.length;i++)rest+=n.steps[i].distance;
  $('hIcon').textContent=ic;$('hDist').textContent=fmt(d);$('hText').textContent=tx_;
  $('hRem').textContent=fmt(rest);$('hTime').textContent=Math.max(1,Math.round(n.dur*rest/Math.max(n.total,1)/60))+' мин';
  if(n.said!==n.i&&d<180){n.said=n.i;say(`Через ${fmt(d)} ${tx_}`)}
  if(heading!=null&&!isNaN(heading)&&speed>1&&!S.followOff)map.easeTo({center:c,bearing:heading,pitch:60,zoom:17,duration:900,essential:true});
  else if(S.user)map.easeTo({center:c,duration:600});
}
function stopNav(){S.nav=null;map.getSource('route').setData({type:'FeatureCollection',features:[]});setMarker('t',null);setMarker('a',null);S.start=null;$('hud').classList.remove('on');speechSynthesis?.cancel()}
$('bStop').onclick=stopNav;
$('bVoice').onclick=e=>{S.voice=!S.voice;e.currentTarget.textContent=S.voice?'🔊':'🔇';if(!S.voice)speechSynthesis?.cancel()};

/* ---------- Мой мир ---------- */
const ACH=[['👣 Первые 1000 шагов',()=>S.steps>=1000],['🧭 Первый маршрут',()=>S.routes>=1],['🗺️ 25 клеток города',()=>S.cells.size>=25],['📥 Карта в кармане',()=>!!S.area]];
function renderWorld(){
  let tot=0,vis=0;
  if(S.area){const[w,s,e,n]=S.area;tot=Math.max(1,(Math.floor(e*500)-Math.floor(w*500)+1)*(Math.floor(n*500)-Math.floor(s*500)+1));
    S.cells.forEach(k=>{const[x,y]=k.split('_').map(Number);if(x>=Math.floor(w*500)&&x<=Math.floor(e*500)&&y>=Math.floor(s*500)&&y<=Math.floor(n*500))vis++})}
  const pct=tot?Math.min(100,vis/tot*100):0;
  $('wBar').style.width=(tot?pct:Math.min(100,S.cells.size))+'%';
  $('wSteps').textContent=S.steps;$('wKm').textContent=(S.m/1000).toFixed(2);$('wCells').textContent=S.cells.size;$('wRoutes').textContent=S.routes;
  $('wPct').textContent=tot?`клеток · ${pct.toFixed(1)}% скачанного района`:'клеток открыто';
  $('ach').innerHTML=ACH.map(a=>`<div class="li ach ${a[1]()?'ok':''}"><span>${a[0]}</span><span>${a[1]()?'✓':'🔒'}</span></div>`).join('');
}
$('wReset').onclick=()=>{if(!confirm('Сбросить шаги и открытые клетки?'))return;S.steps=0;S.m=0;S.cells.clear();S.routes=0;save('dz_routes',0);saveStats();stats();renderWorld()};

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
track();
</script>
