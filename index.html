<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#181a20">
  <title>PWA Навигатор</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #12141c;
      color: #ffffff;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #e8e6e1;
      transition: background 0.3s ease;
    }

    /* Скрытие флага в блоке копирайта Leaflet */
    .leaflet-attribution-flag {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    /* Стиль Blink (Неоновая ночь с высокой контрастностью) */
    body.blink-theme #map {
      background: #0b0d14;
    }
    body.blink-theme .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(195deg) saturate(180%) brightness(92%) contrast(108%);
    }

    /* Верхняя панель поиска (Glassmorphism) */
    .top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 500px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.22);
      padding: 2px 12px;
      border: 1px solid rgba(255,255,255,0.4);
    }

    .search-box input {
      flex: 1;
      height: 46px;
      border: none;
      outline: none;
      font-size: 15px;
      font-weight: 500;
      color: #181a20;
      background: transparent;
      padding-left: 4px;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 8px;
      color: #444;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #clearSearchBtn {
      display: none;
      font-size: 16px;
      color: #888;
    }

    .search-dropdown {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border-radius: 14px;
      max-height: 250px;
      overflow-y: auto;
      list-style: none;
      box-shadow: 0 10px 28px rgba(0,0,0,0.25);
      display: none;
    }

    .search-dropdown li {
      padding: 12px 14px;
      color: #1e222d;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      font-size: 14px;
      cursor: pointer;
      line-height: 1.35;
    }
    .search-dropdown li:last-child { border-bottom: none; }
    .search-dropdown li:active { background: #eef3ff; }

    /* HUD Навигатора (Яндекс Навигатор стиль) */
    .nav-hud {
      position: absolute;
      top: 70px;
      left: 12px;
      right: 12px;
      max-width: 500px;
      background: rgba(24, 28, 38, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
      z-index: 1000;
      display: none;
      flex-direction: column;
      gap: 10px;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .nav-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .nav-step-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .nav-turn-icon {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #007aff, #0051d5);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(0,122,255,0.4);
    }

    .nav-step-distance {
      font-size: 19px;
      font-weight: 800;
      color: #00e676;
    }

    .nav-next-step {
      font-size: 14px;
      font-weight: 500;
      color: #f0f3f8;
      line-height: 1.25;
      margin-top: 2px;
    }

    .nav-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .hud-btn {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: none;
      padding: 8px 11px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .hud-btn.danger {
      background: #ff3b30;
      font-weight: 600;
    }

    .nav-meta {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 8px;
      font-size: 13px;
      color: #a5adba;
    }

    .nav-meta strong {
      color: #ffffff;
      font-size: 14px;
    }

    /* Карточка объекта снизу (2ГИС стиль) */
    .bottom-sheet {
      position: absolute;
      bottom: 16px;
      left: 12px;
      right: 12px;
      max-width: 500px;
      background: rgba(24, 28, 38, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 20px;
      padding: 16px;
      z-index: 1000;
      box-shadow: 0 10px 32px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.1);
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .sheet-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .sheet-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .sheet-subtitle {
      font-size: 13px;
      color: #a5adba;
      margin-top: 4px;
      line-height: 1.3;
    }

    .sheet-close {
      background: rgba(255,255,255,0.08);
      border: none;
      color: #aaa;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
    }

    .sheet-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-primary, .btn-secondary {
      flex: 1;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00e676, #00c853);
      color: #0b140e;
      box-shadow: 0 4px 14px rgba(0,230,118,0.35);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.12);
      color: #ffffff;
    }

    /* Плавающие кнопки справа */
    .controls {
      position: absolute;
      bottom: 175px;
      right: 14px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .floating-btn {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: rgba(24, 28, 38, 0.9);
      backdrop-filter: blur(12px);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
    }

    .floating-btn.active {
      background: #007aff;
      border-color: #4da3ff;
    }

    /* Меню выбора стиля карты */
    .layers-menu {
      position: absolute;
      bottom: 235px;
      right: 70px;
      background: rgba(24, 28, 38, 0.95);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 8px;
      z-index: 1000;
      display: none;
      flex-direction: column;
      gap: 4px;
      width: 185px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .layer-option {
      background: transparent;
      border: none;
      color: #d0d6e2;
      padding: 10px 12px;
      text-align: left;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .layer-option.selected {
      background: #007aff;
      color: #ffffff;
    }

    /* Пульсирующий маркер геопозиции в стиле Blink */
    .user-marker {
      width: 20px;
      height: 20px;
      background: #007aff;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(0,122,255,0.9);
      position: relative;
    }
    .user-marker::after {
      content: '';
      position: absolute;
      top: -12px;
      left: -12px;
      right: -12px;
      bottom: -12px;
      border-radius: 50%;
      border: 2px solid #007aff;
      animation: radarPulse 2s infinite ease-out;
      pointer-events: none;
    }

    @keyframes radarPulse {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    .start-marker {
      width: 18px;
      height: 18px;
      background: #00e676;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 10px rgba(0,230,118,0.6);
    }

    .target-marker {
      width: 26px;
      height: 26px;
      background: #ff2d55;
      border: 3px solid #ffffff;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 4px 12px rgba(255,45,85,0.5);
    }
  </style>
</head>
<body>

  <!-- Поисковая панель -->
  <div class="top-bar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Поиск в стиле 2ГИС и Яндекс..." autocomplete="off">
      <button id="clearSearchBtn" class="icon-btn" title="Очистить">✕</button>
      <button id="searchBtn" class="icon-btn" title="Найти">🔍</button>
    </div>
    <ul id="searchDropdown" class="search-dropdown"></ul>
  </div>

  <!-- Навигационный HUD -->
  <div id="navHud" class="nav-hud">
    <div class="nav-main">
      <div class="nav-step-info">
        <div id="turnIcon" class="nav-turn-icon">⬆️</div>
        <div>
          <div id="stepDist" class="nav-step-distance">0 м</div>
          <div id="nextInstruction" class="nav-next-step">Начните движение</div>
        </div>
      </div>
      <div class="nav-actions">
        <button id="voiceToggleBtn" class="hud-btn" title="Озвучка">🔊</button>
        <button id="cancelNavBtn" class="hud-btn danger">Стоп</button>
      </div>
    </div>
    <div class="nav-meta">
      <span>Осталось: <strong id="routeDistance">-- км</strong></span>
      <span>Прибытие: <strong id="routeDuration">-- мин</strong></span>
    </div>
  </div>

  <!-- Меню переключения карт -->
  <div id="layersMenu" class="layers-menu">
    <button class="layer-option selected" data-layer="dgis">🏢 2ГИС (Яркая)</button>
    <button class="layer-option" data-layer="blink">⚡ Blink (Неон Ночь)</button>
    <button class="layer-option" data-layer="hd">✨ Карта HD (Retina)</button>
    <button class="layer-option" data-layer="hybrid">🛰️ Спутник Гибрид</button>
  </div>

  <!-- Карточка выбранной точки (2ГИС стиль) -->
  <div id="bottomSheet" class="bottom-sheet">
    <div class="sheet-header">
      <div>
        <div id="sheetTitle" class="sheet-title">Выбранная точка</div>
        <div id="sheetSubtitle" class="sheet-subtitle">Координаты</div>
      </div>
      <button id="closeSheetBtn" class="sheet-close">✕</button>
    </div>
    <div class="sheet-buttons">
      <button id="setStartBtn" class="btn-secondary">🚩 Отсюда (А)</button>
      <button id="goRouteBtn" class="btn-primary">🚀 Поехали (Б)</button>
    </div>
  </div>

  <div id="map"></div>

  <!-- Кнопки управления -->
  <div class="controls">
    <button id="layersBtn" class="floating-btn" title="Стиль карты">🗺️</button>
    <button id="locateBtn" class="floating-btn" title="Где я?">📍</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. Инициализация карты без флага в копирайте
    const map = L.map('map', { zoomControl: false }).setView([48.7858, 44.7797], 15);
    map.attributionControl.setPrefix(false);

    // Набор красивых слоев без API-ключей
    const tileLayers = {
      // Настоящая карта 2ГИС с номерами домов и четкими кварталами
      dgis: L.tileLayer('https://tile2.maps.2gis.com/tiles?x={x}&y={y}&z={z}&v=1', {
        maxZoom: 18,
        attribution: '&copy; 2ГИС'
      }),
      // Слой для неонового режима Blink
      blink: L.tileLayer('https://tile2.maps.2gis.com/tiles?x={x}&y={y}&z={z}&v=1', {
        maxZoom: 18,
        attribution: '&copy; Blink Style'
      }),
      // Сверхчеткая Retina-карта (2x разрешение для экранов смартфонов)
      hd: L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=ru&scale=2', {
        maxZoom: 20,
        attribution: '&copy; Maps HD'
      }),
      // Спутник высокого разрешения + названия улиц и домов на русском
      hybrid: L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}&hl=ru&scale=2', {
        maxZoom: 20,
        attribution: '&copy; Satellite HD'
      })
    };

    // По умолчанию включаем красивую карту 2ГИС
    let currentLayerKey = 'dgis';
    tileLayers.dgis.addTo(map);

    // Переключение стилей карты
    const layersBtn = document.getElementById('layersBtn');
    const layersMenu = document.getElementById('layersMenu');
    const layerButtons = document.querySelectorAll('.layer-option');

    layersBtn.addEventListener('click', () => {
      layersMenu.style.display = layersMenu.style.display === 'flex' ? 'none' : 'flex';
    });

    layerButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const chosen = btn.dataset.layer;
        map.removeLayer(tileLayers[currentLayerKey]);
        tileLayers[chosen].addTo(map);
        currentLayerKey = chosen;

        // Включаем неоновый шейдер для стиля Blink
        document.body.classList.toggle('blink-theme', chosen === 'blink');

        layerButtons.forEach((b) => b.classList.remove('selected'));
        btn.classList.add('selected');
        layersMenu.style.display = 'none';
      });
    });

    // 2. Автономные CSS-иконки маркеров
    const userIcon = L.divIcon({ className: 'user-marker', iconSize: [20, 20], iconAnchor: [10, 10] });
    const startIcon = L.divIcon({ className: 'start-marker', iconSize: [18, 18], iconAnchor: [9, 9] });
    const targetIcon = L.divIcon({ className: 'target-marker', iconSize: [26, 26], iconAnchor: [13, 26] });

    // 3. Состояние приложения
    let userCoords = null;
    let manualStartCoords = null;
    let selectedCoords = null;

    let userMarker = null;
    let startMarker = null;
    let targetMarker = null;
    let currentRouteLayer = null;

    let isTracking = false;
    let voiceEnabled = true;

    let activeSteps = [];
    let currentStepIndex = 0;
    let totalRouteDistance = 0;
    let totalRouteDuration = 0;

    // 4. Голосовой ассистент (Web Speech API)
    function speak(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ru-RU';
      utterance.rate = 1.05;
      window.speechSynthesis.speak(utterance);
    }

    document.getElementById('voiceToggleBtn').addEventListener('click', (e) => {
      voiceEnabled = !voiceEnabled;
      e.currentTarget.textContent = voiceEnabled ? '🔊' : '🔇';
      if (!voiceEnabled && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    });

    // 5. GPS-трекинг и ведение по маршруту
    const locateBtn = document.getElementById('locateBtn');

    function startTracking() {
      if (!navigator.geolocation) {
        alert('Геолокация не поддерживается вашим устройством');
        return;
      }

      isTracking = true;
      locateBtn.classList.add('active');

      navigator.geolocation.watchPosition(
        (pos) => {
          userCoords = [pos.coords.latitude, pos.coords.longitude];

          if (!userMarker) {
            userMarker = L.marker(userCoords, { icon: userIcon }).addTo(map);
            if (isTracking) map.flyTo(userCoords, 16);
          } else {
            userMarker.setLatLng(userCoords);
          }

          if (isTracking) {
            map.panTo(userCoords);
          }

          if (activeSteps.length > 0) {
            updateLiveNavigation(userCoords);
          }
        },
        (err) => {
          console.warn('GPS недоступен:', err.message);
          locateBtn.classList.remove('active');
        },
        { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
      );
    }

    locateBtn.addEventListener('click', () => {
      if (userCoords) {
        isTracking = true;
        locateBtn.classList.add('active');
        map.flyTo(userCoords, 16);
      } else {
        startTracking();
      }
    });

    map.on('dragstart', () => {
      isTracking = false;
      locateBtn.classList.remove('active');
      layersMenu.style.display = 'none';
    });

    // 6. Поиск мест через Nominatim API
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const searchDropdown = document.getElementById('searchDropdown');

    async function searchPlaces(query) {
      if (!query || query.length < 2) return;
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&accept-language=ru&q=${encodeURIComponent(query)}&limit=6&addressdetails=1`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.error) {
          alert('В офлайн-режиме текстовый поиск недоступен. Выберите точку нажатием на карту.');
          return;
        }
        renderDropdown(data);
      } catch (err) {
        console.error('Ошибка поиска:', err);
      }
    }

    let searchTimer = null;
    searchInput.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      clearSearchBtn.style.display = val ? 'flex' : 'none';
      clearTimeout(searchTimer);
      if (!val) {
        searchDropdown.style.display = 'none';
        return;
      }
      searchTimer = setTimeout(() => searchPlaces(val), 400);
    });

    searchBtn.addEventListener('click', () => searchPlaces(searchInput.value.trim()));

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearSearchBtn.style.display = 'none';
      searchDropdown.style.display = 'none';
    });

    function renderDropdown(items) {
      searchDropdown.innerHTML = '';
      if (!items || !items.length) {
        searchDropdown.style.display = 'none';
        return;
      }

      items.forEach((item) => {
        const li = document.createElement('li');
        li.textContent = item.display_name;
        li.addEventListener('click', () => {
          const coords = [parseFloat(item.lat), parseFloat(item.lon)];
          searchDropdown.style.display = 'none';
          const shortTitle = item.display_name.split(',')[0];
          searchInput.value = shortTitle;
          selectPointOnMap(coords, shortTitle, item.display_name);
          map.flyTo(coords, 16);
        });
        searchDropdown.appendChild(li);
      });
      searchDropdown.style.display = 'block';
    }

    // 7. Выбор любой точки кликом по карте
    const bottomSheet = document.getElementById('bottomSheet');
    const sheetTitle = document.getElementById('sheetTitle');
    const sheetSubtitle = document.getElementById('sheetSubtitle');

    map.on('click', async (e) => {
      searchDropdown.style.display = 'none';
      layersMenu.style.display = 'none';
      const coords = [e.latlng.lat, e.latlng.lng];
      const coordText = `${coords[0].toFixed(5)}, ${coords[1].toFixed(5)}`;

      selectPointOnMap(coords, 'Точка на карте', `Координаты: ${coordText}`);

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&accept-language=ru&lat=${coords[0]}&lon=${coords[1]}`);
        const data = await res.json();
        if (data && data.display_name) {
          const shortName = data.name || data.display_name.split(',')[0];
          sheetTitle.textContent = shortName;
          sheetSubtitle.textContent = data.display_name;
        }
      } catch {
        // В офлайне оставляем координаты
      }
    });

    function selectPointOnMap(coords, title, subtitle) {
      selectedCoords = coords;
      if (targetMarker) map.removeLayer(targetMarker);
      targetMarker = L.marker(coords, { icon: targetIcon }).addTo(map);

      sheetTitle.textContent = title;
      sheetSubtitle.textContent = subtitle;
      bottomSheet.style.display = 'flex';
    }

    document.getElementById('closeSheetBtn').addEventListener('click', () => {
      bottomSheet.style.display = 'none';
      if (targetMarker && activeSteps.length === 0) {
        map.removeLayer(targetMarker);
      }
    });

    document.getElementById('setStartBtn').addEventListener('click', () => {
      if (!selectedCoords) return;
      manualStartCoords = [...selectedCoords];
      if (startMarker) map.removeLayer(startMarker);
      startMarker = L.marker(manualStartCoords, { icon: startIcon }).addTo(map);
      bottomSheet.style.display = 'none';
      if (targetMarker) map.removeLayer(targetMarker);
    });

    document.getElementById('goRouteBtn').addEventListener('click', () => {
      if (!selectedCoords) return;
      bottomSheet.style.display = 'none';
      buildRouteTo(selectedCoords);
    });

    // 8. Переводчик маневров OSRM на русский язык
    function parseManeuver(step) {
      if (!step || !step.maneuver) {
        return { icon: '⬆️', text: 'Двигайтесь по маршруту' };
      }

      const type = step.maneuver.type;
      const mod = step.maneuver.modifier || '';
      const street = step.name ? ` на ${step.name}` : '';

      if (type === 'arrive') return { icon: '🏁', text: 'Вы прибыли в точку назначения' };
      if (type === 'depart') return { icon: '⬆️', text: `Начните движение${street}` };
      if (type === 'roundabout' || type === 'rotary') {
        const exit = step.maneuver.exit ? ` (${step.maneuver.exit}-й съезд)` : '';
        return { icon: '🔄', text: `Круговое движение${exit}${street}` };
      }

      if (mod.includes('sharp right')) return { icon: '⤵️', text: `Резко направо${street}` };
      if (mod.includes('slight right')) return { icon: '↗️', text: `Плавно направо${street}` };
      if (mod.includes('right')) return { icon: '↱', text: `Поверните направо${street}` };

      if (mod.includes('sharp left')) return { icon: '⤴️', text: `Резко налево${street}` };
      if (mod.includes('slight left')) return { icon: '↖️', text: `Плавно налево${street}` };
      if (mod.includes('left')) return { icon: '↰', text: `Поверните налево${street}` };

      if (mod.includes('uturn')) return { icon: '↩️', text: `Развернитесь${street}` };

      return { icon: '⬆️', text: `Двигайтесь прямо${street}` };
    }

    function formatDistance(meters) {
      if (meters >= 1000) return `${(meters / 1000).toFixed(1)} км`;
      return `${Math.round(meters)} м`;
    }

    // 9. Построение маршрута с двухслойной неоновой обводкой
    async function buildRouteTo(destination) {
      let origin = manualStartCoords || userCoords;
      if (!origin) {
        const center = map.getCenter();
        origin = [center.lat, center.lng];
        if (startMarker) map.removeLayer(startMarker);
        startMarker = L.marker(origin, { icon: startIcon }).addTo(map);
      }

      const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${origin[1]},${origin[0]};${destination[1]},${destination[0]}?overview=full&geometries=geojson&steps=true`;

      try {
        const res = await fetch(osrmUrl);
        const data = await res.json();

        if (data.error || !data.routes || !data.routes.length) {
          alert('Не удалось построить маршрут. Проверьте подключение к сети.');
          return;
        }

        const route = data.routes[0];
        drawRoute(route.geometry);

        activeSteps = route.legs[0]?.steps || [];
        currentStepIndex = activeSteps.length > 1 ? 1 : 0;
        totalRouteDistance = route.distance;
        totalRouteDuration = route.duration;

        renderHudStep();
        document.getElementById('navHud').style.display = 'flex';

        const currentInfo = parseManeuver(activeSteps[currentStepIndex]);
        const stepDist = activeSteps[currentStepIndex - 1]?.distance || activeSteps[currentStepIndex]?.distance || 0;
        speak(`Маршрут построен. Через ${formatDistance(stepDist)} ${currentInfo.text}`);

      } catch (err) {
        console.error('Ошибка маршрутизации:', err);
        alert('Сервер маршрутизации временно недоступен.');
      }
    }

    function drawRoute(geoJsonGeometry) {
      if (currentRouteLayer) map.removeLayer(currentRouteLayer);

      // Двухслойная линия маршрута как в Яндекс Навигаторе / 2ГИС (контрастная подложка + яркий центр)
      const outline = L.geoJSON(geoJsonGeometry, {
        style: { color: '#002b5c', weight: 10, opacity: 0.85, lineJoin: 'round', lineCap: 'round' }
      });

      const coreLine = L.geoJSON(geoJsonGeometry, {
        style: { color: '#00e676', weight: 6, opacity: 1, lineJoin: 'round', lineCap: 'round' }
      });

      currentRouteLayer = L.layerGroup([outline, coreLine]).addTo(map);
      map.fitBounds(outline.getBounds(), { padding: [70, 70] });
    }

    function renderHudStep(customDistToTurn = null) {
      const step = activeSteps[currentStepIndex];
      if (!step) return;

      const info = parseManeuver(step);
      const distToTurn = customDistToTurn !== null
        ? customDistToTurn
        : (activeSteps[currentStepIndex - 1]?.distance || step.distance || 0);

      document.getElementById('turnIcon').textContent = info.icon;
      document.getElementById('stepDist').textContent = formatDistance(distToTurn);
      document.getElementById('nextInstruction').textContent = info.text;

      document.getElementById('routeDistance').textContent = formatDistance(totalRouteDistance);
      document.getElementById('routeDuration').textContent = `${Math.max(1, Math.round(totalRouteDuration / 60))} мин`;
    }

    function updateLiveNavigation(currentPos) {
      const step = activeSteps[currentStepIndex];
      if (!step || !step.maneuver || !step.maneuver.location) return;

      const maneuverLatLng = L.latLng(step.maneuver.location[1], step.maneuver.location[0]);
      const userLatLng = L.latLng(currentPos[0], currentPos[1]);
      const distToManeuver = userLatLng.distanceTo(maneuverLatLng);

      if (distToManeuver < 25) {
        if (currentStepIndex < activeSteps.length - 1) {
          currentStepIndex++;
          const nextStep = activeSteps[currentStepIndex];
          const info = parseManeuver(nextStep);
          speak(info.text);
          renderHudStep();
        } else {
          speak('Вы прибыли в точку назначения');
          stopNavigation();
        }
      } else {
        renderHudStep(distToManeuver);
      }
    }

    function stopNavigation() {
      if (currentRouteLayer) map.removeLayer(currentRouteLayer);
      if (targetMarker) map.removeLayer(targetMarker);
      if (startMarker) map.removeLayer(startMarker);
      manualStartCoords = null;
      activeSteps = [];
      currentStepIndex = 0;
      document.getElementById('navHud').style.display = 'none';
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    document.getElementById('cancelNavBtn').addEventListener('click', stopNavigation);

    // 10. Регистрация Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.update();
        }).catch((err) => console.error('Ошибка регистрации SW:', err));
      });
    }

    startTracking();
  </script>
</body>
</html>
