<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0d14">
  <title>Blink 3D Navigator</title>

  <!-- Подключаем MapLibre GL JS (библиотека для 3D-карт) -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0d14;
      color: #ffffff;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Верхний виджет шагов в стиле Blink */
    .steps-badge {
      position: absolute;
      top: 14px;
      left: 16px;
      background: rgba(24, 28, 40, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 14px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    /* Правые плавающие кнопки */
    .floating-controls {
      position: absolute;
      top: 14px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
    }

    .float-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(24, 28, 40, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }

    /* Нижняя панель навигации в стиле Blink */
    .bottom-nav {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      height: 72px;
      background: rgba(18, 22, 32, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
      max-width: 450px;
      margin: 0 auto;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: #8f9bb3;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-item.active {
      color: #00e676;
    }

    .nav-item span.icon {
      font-size: 20px;
    }

    /* Круглая центральная кнопка «Мой мир» */
    .world-btn {
      background: linear-gradient(135deg, #007aff, #00c853);
      color: white;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 6px 20px rgba(0,122,255,0.4);
      border: none;
      cursor: pointer;
      margin-top: -16px;
    }

    /* Маркер пользователя с пульсацией */
    .user-pill {
      width: 22px;
      height: 22px;
      background: #007aff;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(0,122,255,0.9);
    }
  </style>
</head>
<body>

  <!-- Верхний виджет шагов -->
  <div class="steps-badge">
    <span>👟</span> <span>462 шага • 3 место</span>
  </div>

  <!-- Правые кнопки -->
  <div class="floating-controls">
    <button class="float-btn" id="tiltBtn" title="Наклон 3D">🌐</button>
    <button class="float-btn" id="locateBtn" title="Где я?">📍</button>
  </div>

  <!-- Карта -->
  <div id="map"></div>

  <!-- Нижняя панель в стиле Blink -->
  <div class="bottom-nav">
    <button class="nav-item active">
      <span class="icon">📍</span>
      <span>карта</span>
    </button>
    <button class="nav-item">
      <span class="icon">👥</span>
      <span>друзья</span>
    </button>
    <button class="world-btn" title="Мой мир">🌍</button>
    <button class="nav-item">
      <span class="icon">💬</span>
      <span>чаты</span>
    </button>
    <button class="nav-item">
      <span class="icon">👤</span>
      <span>ты</span>
    </button>
  </div>

  <script>
    // Инициализация MapLibre с векторным стилем и поддержкой 3D-зданий
    const map = new maplibregl.Map({
      container: 'map',
      // Используем бесплатный современный векторный стиль OpenFreeMap (или пропишем темный стиль)
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [44.7797, 48.7858], // Начальные координаты
      zoom: 15,
      pitch: 45, // Наклон для 3D объема
      bearing: -17,
      maxZoom: 19
    });

    map.on('load', () => {
      // Добавляем объемные 3D-здания из векторных тайлов
      const layers = map.getStyle().layers;
      let labelLayerId;
      for (let i = 0; i < layers.length; i++) {
        if (layers[i].type === 'symbol' && layers[i].layout['text-field']) {
          labelLayerId = layers[i].id;
          break;
        }
      }

      // Если в стиле есть слой зданий, делаем их трехмерными
      if (map.getLayer('building')) {
        map.addLayer({
          'id': '3d-buildings',
          'source': 'openmaptiles',
          'source-layer': 'building',
          'type': 'fill-extrusion',
          'minzoom': 14,
          'paint': {
            'fill-extrusion-color': '#2a324b',
            'fill-extrusion-height': ['coalesce', ['get', 'height'], 15],
            'fill-extrusion-base': ['coalesce', ['get', 'min_height'], 0],
            'fill-extrusion-opacity': 0.85
          }
        }, labelLayerId);
      }
    });

    // Кнопка переключения 3D наклона камеры
    let isTilted = true;
    document.getElementById('tiltBtn').addEventListener('click', () => {
      isTilted = !isTilted;
      map.easeTo({
        pitch: isTilted ? 55 : 0,
        bearing: isTilted ? 20 : 0,
        duration: 1000
      });
    });

    // Геолокация пользователя
    let userMarker = null;
    document.getElementById('locateBtn').addEventListener('click', () => {
      if (!navigator.geolocation) return alert('GPS не поддерживается');
      
      navigator.geolocation.getCurrentPosition((pos) => {
        const lng = pos.coords.longitude;
        const lat = pos.coords.latitude;

        map.flyTo({ center: [lng, lat], zoom: 17, pitch: 50 });

        if (!userMarker) {
          const el = document.createElement('div');
          el.className = 'user-pill';
          userMarker = new maplibregl.Marker(el).setLngLat([lng, lat]).addTo(map);
        } else {
          userMarker.setLngLat([lng, lat]);
        }
      }, () => alert('Не удалось получить координаты'));
    });
  </script>
</body>
</html>
